name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: botuser
          POSTGRES_PASSWORD: botuser
          POSTGRES_DB: botbyai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U botuser -d botbyai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The integration suite runs against this database when TEST_DATABASE_URL
      # is present; without it those tests skip instead of reporting false passes.
      TEST_DATABASE_URL: postgres://botuser:botuser@localhost:5432/botbyai_test
      DATABASE_URL: postgres://botuser:botuser@localhost:5432/botbyai_test
      MIGRATIONS_DIR: ${{ github.workspace }}/database/migrations

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check
        continue-on-error: false

      - name: ESLint
        run: npm run lint

      - name: Typecheck (all workspaces + tests)
        run: npm run typecheck:all

      - name: Build packages, bot and dashboard
        run: npm run build

      - name: Unit tests
        run: npx vitest run tests/unit

      - name: Integration tests (real PostgreSQL service)
        run: npx vitest run tests/integration

      - name: Count registered slash commands
        run: npm run commands:count

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: bot-by-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: false
          tags: bot-by-ai-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate compose file
        run: docker compose -f docker-compose.yml config --quiet
