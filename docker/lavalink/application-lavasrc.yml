# Minimal, documented Lavalink 4 configuration for Bot-by-ai.
# The bot connects with the password from LAVALINK_PASSWORD (env), so keep
# `lavalink.server.password` in sync with that variable — do not commit secrets,
# this file is meant to be a template.
server:
  port: 2333
  address: 0.0.0.0
lavalink:
  server:
    password: 'change-me-lavalink' # override via LAVALINK_SERVER_PASSWORD / compose env
    sources:
      youtube: true
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true
logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30
metrics:
  prometheus:
    enabled: false
    endpoint: /metrics
# LavaSrc resolves Spotify/Apple Music/Deezer *metadata* into searchable queries.
# You still need real audio sources (the bot searches an equivalent source) and
# your own Spotify application credentials: https://developer.spotify.com
plugins:
  lavasrc:
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: true
    spotify:
      clientId: '${SPOTIFY_CLIENT_ID}'
      clientSecret: '${SPOTIFY_CLIENT_SECRET}'
      countryCode: IN
      playlistLoadLimit: 6
      albumLoadLimit: 6
    providers: []
